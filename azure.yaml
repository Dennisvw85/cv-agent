name: cv-agent
infra:
  provider: bicep
  path: infra
services:
  api:
    project: ./api
    language: py
    host: containerapp
    docker:
      path: Dockerfile
      remoteBuild: true
hooks:
  postprovision:
    shell: sh
    run: ./scripts/postprovision.sh
    interactive: false
    continueOnError: false
